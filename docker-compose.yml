# 个人健康助手 · Docker Compose(P1:PostgreSQL + pgvector;Redis 为 V4 预留)
# 变量从同目录 .env 读取(PG_* 等)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: health-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-health}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 未配置}
      POSTGRES_DB: ${PG_DB:-health_assistant}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-health} -d ${PG_DB:-health_assistant}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: health-redis
    ports:
      - "6381:6379"
    profiles: ["v4"]   # V4 才启用:docker compose --profile v4 up -d redis

volumes:
  pgdata:
